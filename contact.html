<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactez-nous - Mairie de Yene</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/src/styles/style.css">
    <link rel="icon" type="image/png" href="/src/assets/log.webp">
</head>
<body>

    <div id="global-header"></div>

    <header class="page-header small">
        <div class="header-content" data-aos="fade-up">
            <span class="badge">Relation Citoyenne</span>
            <h1>Nous <span class="text-gradient">Contacter</span></h1>
            <p>Une question ? Un signalement ? Nos services sont à votre écoute.</p>
        </div>
    </header>

    <section class="container py-80">
        <div class="contact-layout">
            
            <div class="glass p-30 contact-form-wrapper" data-aos="fade-right">
                <h2 style="margin-bottom: 20px;">Envoyer un message</h2>
                
                <div id="form-status" style="display:none; padding: 15px; border-radius: 8px; margin-bottom: 20px;"></div>

                <form id="my-form" action="https://formspree.io/f/mqarnvgo" method="POST">
                    <div class="form-group">
                        <label for="name">Nom complet</label>
                        <input type="text" id="name" name="name" placeholder="Votre nom" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="votre@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="sujet">Sujet</label>
                        <select id="sujet" name="sujet">
                            <option value="info">Demande d'information</option>
                            <option value="signalement">Signalement (Voirie, Éclairage...)</option>
                            <option value="rdv">Demande de RDV Maire</option>
                            <option value="etat-civil">État Civil</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Comment pouvons-nous vous aider ?" required></textarea>
                    </div>

                    <button type="submit" id="my-form-button" class="btn-primary full-width">Envoyer le message</button>
                </form>
            </div>

            <div class="contact-info" data-aos="fade-left">
                <div class="glass p-30 mb-30">
                    <h3 style="margin-bottom: 20px;">Nos Coordonnées</h3>
                    <ul class="info-list">
                        <li><i class="fas fa-map-marker-alt"></i> Hôtel de Ville, Yene Guedj</li>
                        <li><i class="fas fa-phone"></i> +221 33 800 00 00</li>
                        <li><i class="fas fa-envelope"></i> contact@mairieyene.sn</li>
                        <li><i class="fas fa-clock"></i> Lun-Ven: 8h-16h</li>
                    </ul>
                </div>
                
                <div id="map-contact" class="glass" style="height: 350px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.2); z-index: 5;"></div>
            </div>

        </div>
    </section>

    <div id="global-footer"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module" src="/src/scripts/script.js"></script>

    <script>
        // --- GESTION DU FORMULAIRE FORMSPREE ---
        const form = document.getElementById("my-form");
        
        async function handleSubmit(event) {
            event.preventDefault();
            const status = document.getElementById("form-status");
            const btn = document.getElementById("my-form-button");
            const data = new FormData(event.target);

            const originalText = btn.innerText;
            btn.innerText = "Envoi en cours...";
            btn.disabled = true;

            fetch(event.target.action, {
                method: form.method,
                body: data,
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    status.style.display = "block";
                    status.style.backgroundColor = "rgba(0, 133, 63, 0.1)";
                    status.style.color = "#00853f";
                    status.style.border = "1px solid #00853f";
                    status.innerHTML = "<i class='fas fa-check-circle'></i> Merci ! Votre message a bien été envoyé.";
                    form.reset();
                    setTimeout(() => { status.style.display = "none"; }, 5000);
                } else {
                    status.innerHTML = "Oups! Il y a eu un problème.";
                    status.style.display = "block";
                    status.style.color = "red";
                }
            }).catch(error => {
                status.innerHTML = "Oups! Erreur de connexion.";
                status.style.display = "block";
            }).finally(() => {
                btn.innerText = originalText;
                btn.disabled = false;
            });
        }
        form.addEventListener("submit", handleSubmit);

        // --- GESTION DE LA CARTE ---
        function initContactMap() {
            const lat = 14.6591; // Coordonnées ajustées
            const lng = -17.1120;

            if (typeof L !== 'undefined') {
                const map = L.map('map-contact').setView([lat, lng], 14);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(map);

                const mairieIcon = L.divIcon({
                    className: 'custom-marker',
                    html: '<div style="background-color: var(--yene-green); width: 20px; height: 20px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.3);"></div>',
                    iconSize: [20, 20]
                });

                L.marker([lat, lng]).addTo(map)
                    .bindPopup('<b>Mairie de Yène</b><br>Hôtel de Ville.')
                    .openPopup();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            AOS.init({ duration: 800, once: true });
            initContactMap();
        });
    </script>

    <style>
        /* Ajustements spécifiques pour la page contact */
        .contact-layout {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 30px;
        }

        .info-list {
            list-style: none;
            padding: 0;
        }

        .info-list li {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            color: var(--text-soft);
        }

        .info-list i {
            color: var(--yene-green);
            width: 20px;
        }

        @media (max-width: 992px) {
            .contact-layout {
                grid-template-columns: 1fr;
            }
            .page-header.small { padding: 60px 20px; }
        }
    </style>
</body>
</html>
